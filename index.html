<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fcf8f1">
  <meta name="description" content="في بيتنا العُماني — ثلاثة أنشطة لعب تفاعلية للتواصل الوظيفي بالصور">
  <title>في بيتنا العُماني | نلعب ونتواصل</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app" class="app">
    <header class="topbar">
      <button class="brand" id="homeBtn" type="button" aria-label="الرجوع إلى الصفحة الرئيسية">
        <span class="brand-icon" aria-hidden="true">⌂</span>
        <span>في بيتنا العُماني</span>
      </button>
      <div class="header-tools">
        <button id="adultBtn" class="icon-btn" type="button" aria-label="إعدادات المرافق" title="إعدادات المرافق">⚙</button>
      </div>
    </header>
    <main id="mainContent" aria-live="polite">
      <section class="skeleton"><h1>في بيتنا العُماني</h1><p>🎮</p></section>
    </main>
    <footer class="footer-note">تجربة تعليمية داعمة للتواصل بالصور — بدون حساب أو جمع أسماء</footer>
  </div>

  <dialog class="adult-dialog" id="adultDialog" aria-labelledby="adultTitle">
    <div class="dialog-header">
      <h2 id="adultTitle">إعدادات المرافق</h2>
      <button id="closeAdult" type="button" class="icon-btn" aria-label="إغلاق">✕</button>
    </div>
    <div class="tabs" role="tablist" aria-label="أقسام الإعدادات">
      <button type="button" class="tab active" data-tab="session">الجلسة</button>
      <button type="button" class="tab" data-tab="sounds">الأصوات</button>
      <button type="button" class="tab" data-tab="pictures">الصور</button>
    </div>
    <div id="adultContent" class="adult-content"></div>
  </dialog>
  <script defer src="app.js"></script>
</body>
</html>
