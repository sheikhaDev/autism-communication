<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f8f7f4">
<meta name="description" content="أنشطة تفاعلية للتواصل المصور دون الحاجة إلى القراءة">
<title>أختار وأتواصل – أنشطة تفاعلية مصورة</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="layout" id="site">
  <header class="toolbar" aria-label="التنقل">
    <button class="small-icon" id="goHome" type="button" aria-label="الرئيسية" title="الرئيسية">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11 12 3l9 8v9a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg>
    </button>
    <div class="three-dots" id="progressStages" aria-label="مراحل النشاط"><span></span><span></span><span></span></div>
    <button class="small-icon" id="openSettings" type="button" aria-label="إعدادات البالغ" title="إعدادات البالغ">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="m19.3 15 .1.1 1.3 1.4-2 3.4-1.9-.5a8.5 8.5 0 0 1-1.6.9L14.6 22h-4L10 20.3a8.5 8.5 0 0 1-1.6-.9l-1.9.5-2-3.4 1.3-1.4A8.6 8.6 0 0 1 5.6 13L4 12l1.6-1a8.6 8.6 0 0 1 .2-2.1L4.5 7.5l2-3.4 1.9.5A8.5 8.5 0 0 1 10 3.7L10.6 2h4l.6 1.7a8.5 8.5 0 0 1 1.6.9l1.9-.5 2 3.4-1.3 1.4a8.6 8.6 0 0 1 .2 2.1l1.6 1-1.6 1a8.6 8.6 0 0 1-.3 2z"/></svg>
    </button>
  </header>
  <main id="screen" aria-live="polite"></main>
  <div class="sr-only" id="announcer" aria-live="polite"></div>
</div>
<dialog id="adultDialog" class="adult-dialog" aria-label="إعدادات البالغ">
  <div class="adult-top"><h2>متابعة الأنشطة</h2><button type="button" id="closeSettings" aria-label="إغلاق">✕</button></div>
  <div class="tabs"><button type="button" data-tab="session" class="tab selected">التقييم</button><button type="button" data-tab="audio" class="tab">الصوت</button><button type="button" data-tab="info" class="tab">الإرشادات</button></div>
  <div id="adultBody"></div>
</dialog>
<script defer src="app.js"></script>
</body>
</html>
