<!doctype html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>أنشطة التواصل</title><link rel="stylesheet" href="styles.css"></head><body><div id="app"><div class="shell"><div class="topbar"><button id="globalSound" class="sound" aria-label="sound">🔊</button><button id="backBtn" class="back hidden" aria-label="back"></button></div>
<section id="home" class="stage active"><div class="hero"><div class="heroCard"><h1>أنشطة تواصل</h1><p>ثلاث مراحل متدرجة: اختيار بصري، محاكي غرفة، ثم طلب في موقف حقيقي.</p><div class="pillRow"><span class="pill">صور واضحة</span><span class="pill">أصوات عُمانية</span><span class="pill">تعزيز هادئ</span></div></div><div class="heroImg"><img src="assets/images/room_house.svg" alt=""></div></div><div class="grid3"><button class="entry" data-open="stage1"><img src="assets/images/icon_choose.svg" alt=""><h2>1</h2><p>اختيار من صورتين كبيرتين</p></button><button class="entry" data-open="stage2"><img src="assets/images/icon_sim.svg" alt=""><h2>2</h2><p>التنقل داخل غرف والضغط على الأشياء</p></button><button class="entry" data-open="stage3"><img src="assets/images/icon_real.svg" alt=""><h2>3</h2><p>طلب الشيء ثم تنفيذه في الواقع</p></button></div></section>
<section id="stage1" class="stage"><div class="activityWrap"><div class="centerTop"><div id="dots1" class="dots"></div></div><div class="bigPrompt"><button class="sound" onclick="document.getElementById('globalSound').click()">🔊</button><div class="promptBubble"><div class="stars">⭐</div></div></div><div id="choiceBoard" class="choiceBoard"></div><div id="stage1Summary"></div><div class="footerBtns"><button class="softBtn" onclick="showStage('home')">🏠</button></div></div></section>
<section id="stage2" class="stage"><div class="activityWrap"><div class="roomFrame"><div class="roomTabs" id="roomTabs"></div><button id="simLeft" class="navArrow left">›</button><button id="simRight" class="navArrow right">‹</button><div id="roomStrip" class="roomStrip"></div><div id="overlay" class="overlay"><div class="popup"><img id="popupImg" src="" alt=""><div class="acts"><button id="popupUse" class="nextBtn">🔊</button><button id="popupClose" class="softBtn">✕</button></div></div></div></div><div class="footerBtns"><button class="softBtn" onclick="showStage('home')">🏠</button></div></div></section>
<section id="stage3" class="stage"><div class="activityWrap"><div class="realWrap"><div class="realTarget"><button class="sound" onclick="play('real')">🔊</button><div class="spot"><img id="realTargetImg" src="" alt=""></div><button id="realNext" class="nextBtn">➡️</button></div><div><div class="realCards"><div id="realCardGrid" class="cardGrid"></div></div><div class="adultPanel"><div class="group"><button id="markIndependent" class="miniBtn">✅</button><button id="markHelp" class="miniBtn">🤝</button></div><div id="realStats"></div></div></div></div><div class="footerBtns"><button class="softBtn" onclick="showStage('home')">🏠</button></div></div></section>
<div id="toast" class="toast">⭐</div></div></div><script src="app.js"></script></body></html>
